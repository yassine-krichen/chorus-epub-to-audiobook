[project]
name = "book2audio"
version = "0.1.0"
description = "Turn an EPUB into a narrated, multi-voice audiobook (.m4b) with one command."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "kokoro-onnx>=0.4.7",
    "soundfile>=0.12",
    "numpy>=1.26",
    "rich>=13.7",
    "httpx>=0.27",
    "fastapi>=0.115",
    "email-validator>=2.1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "boto3>=1.34",
    "google-auth>=2.34",
    "requests>=2.32",
]

[project.scripts]
book2audio = "book2audio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/book2audio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0"]
